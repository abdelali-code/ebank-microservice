spring.application.name=ebank-chatboot
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
server.port=8081
# MCP servers are referenced by their Eureka service name.
# McpDiscoveryConfig resolves each name to a real instance before every request.
spring.ai.mcp.client.streamable-http.connections.customer.url=http://customer-service
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://ebank-service
